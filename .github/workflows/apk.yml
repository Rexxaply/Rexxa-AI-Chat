# Membangun APK REXXA AI (Capacitor) setiap ada perubahan di main, atau manual dari tab Actions.
# Hasil: GitHub Release "apk-terbaru" berisi rexxa-ai.apk (bisa diunduh langsung dari HP).
#
# Dipakai di repo fork (APK sendiri dengan Firebase sendiri)? Atur di Settings → Secrets and variables → Actions:
#   Variables: APP_ID   (mis. com.namamu.rexxa, harus sama dengan package di Firebase)
#              APP_NAME (nama di layar HP, mis. "REXXA Budi")
#   Secrets:   GOOGLE_SERVICES_JSON  (isi file google-services.json dari Firebase-mu)
#              APK_KEYSTORE_B64 + APK_KEYSTORE_PASSWORD (opsional: kunci tanda tangan sendiri, base64)
# Tanpa pengaturan di atas, APK dibangun sebagai com.rexxa.ai dengan Firebase rexxa-ai.
# Panduan lengkap: panduan-apk-sendiri.md
name: Build APK
on:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "manifest.webmanifest", "icons/**", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apk } }
    env:
      APP_ID: ${{ vars.APP_ID || 'com.rexxa.ai' }}
      APP_NAME: ${{ vars.APP_NAME || 'REXXA AI' }}
      GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      KS_ALIAS_IN: ${{ vars.APK_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Cek Android SDK bawaan runner
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms
      - name: Siapkan berkas web
        run: |
          mkdir -p www
          cp ../index.html ../sw.js ../manifest.webmanifest www/
          cp -r ../icons www/
      - name: Identitas aplikasi & file Firebase
        run: |
          set -e
          echo "APP_ID=$APP_ID · APP_NAME=$APP_NAME"
          node -e '
            const fs = require("fs"); const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.appId = process.env.APP_ID; c.appName = process.env.APP_NAME;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));'
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > google-services.json; echo "google-services.json dari secret GOOGLE_SERVICES_JSON"; fi
          node -e '
            const fs = require("fs"); let j;
            try { j = JSON.parse(fs.readFileSync("google-services.json", "utf8")); }
            catch (e) { console.error("::error::google-services.json tidak valid. Tempel seluruh isi file dari Firebase ke secret GOOGLE_SERVICES_JSON."); process.exit(1); }
            const pk = (j.client || []).map((c) => c?.client_info?.android_client_info?.package_name);
            console.log("Firebase project:", j.project_info?.project_id, "· package:", pk.join(", "));
            if (!pk.includes(process.env.APP_ID)) {
              console.error(`::error::Package ${process.env.APP_ID} tidak terdaftar di google-services.json (${pk.join(", ")}). Daftarkan aplikasi Android dengan package itu di Firebase, atau samakan variabel APP_ID.`);
              process.exit(1);
            }'
      - name: Pasang Capacitor
        run: npm install --no-audit --no-fund
      - name: Sisipkan JavaScript Capacitor ke halaman (penghubung ke plugin native)
        run: |
          set -e
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          cp node_modules/@capacitor/push-notifications/dist/plugin.js www/cap-push.js
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/cap-fs.js
          head -c 300 www/cap-push.js; echo
          grep -q "registerPlugin" www/cap-push.js
          grep -q "capacitorExports" www/capacitor.js
          sed -i '0,/<head>/s##<head>\n    <script src="capacitor.js"></script>\n    <script src="cap-push.js"></script>\n    <script src="cap-fs.js"></script>#' www/index.html
          head -8 www/index.html
      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon aplikasi
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icons/icon-maskable-192.png $R/mipmap-$d/ic_launcher.png
            cp ../icons/icon-maskable-192.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Firebase (notifikasi push native)
        run: |
          cp google-services.json android/app/google-services.json
          R=android/app/src/main/res
          mkdir -p $R/drawable
          cp ../icons/badge-96.png $R/drawable/ic_stat_rexxa.png
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rexxa" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="manga" />\n    </application>#' $M
          grep -n "firebase\|POST_NOTIFICATIONS" $M || true
      - name: Kunci tanda tangan tetap (agar update bisa dipasang menimpa versi lama)
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$PWD/own.keystore"
            { echo "KS_FILE=$PWD/own.keystore"; echo "KS_PASS_EFF=$KS_PASS"; echo "KS_ALIAS=${KS_ALIAS_IN:-rexxa}"; echo "KS_DEFAULT=0"; } >> "$GITHUB_ENV"
            echo "Memakai kunci dari secret APK_KEYSTORE_B64"
          else
            { echo "KS_FILE=$PWD/rexxa-debug.keystore"; echo "KS_PASS_EFF=android"; echo "KS_ALIAS=androiddebugkey"; echo "KS_DEFAULT=1"; } >> "$GITHUB_ENV"
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  rexxa {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS_EFF')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS_EFF')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.rexxa }
              }
          }
          GRADLE
      - name: Build APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rexxa-ai.apk
          # pastikan APK memakai kunci tetap (SHA-256 sertifikat harus sama di setiap build)
          keytool -printcert -jarfile ../rexxa-ai.apk | grep -i "SHA256:"
          if [ "$KS_DEFAULT" = "1" ]; then keytool -printcert -jarfile ../rexxa-ai.apk | grep -qi "BB:6C:E0:3D:7A:72:20:77"; fi
      - uses: actions/upload-artifact@v4
        with: { name: rexxa-ai-apk, path: apk/rexxa-ai.apk }
      - name: Terbitkan ke Release "apk-terbaru"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru rexxa-ai.apk --title "$APP_NAME APK (build ${{ github.run_number }})" --notes "Dibangun otomatis dari commit ${{ github.sha }} · paket $APP_ID. Unduh rexxa-ai.apk lalu pasang di HP Android." --latest
