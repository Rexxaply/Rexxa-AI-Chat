# Membangun APK REXXA AI (Capacitor) setiap ada perubahan di main, atau manual dari tab Actions.
# Hasil: GitHub Release "apk-terbaru" berisi rexxa-ai.apk (bisa diunduh langsung dari HP).
name: Build APK
on:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "manifest.webmanifest", "icons/**", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apk } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Cek Android SDK bawaan runner
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms
      - name: Siapkan berkas web
        run: |
          mkdir -p www
          cp ../index.html ../sw.js ../manifest.webmanifest www/
          cp -r ../icons www/
      - name: Pasang Capacitor
        run: npm install --no-audit --no-fund
      - name: Sisipkan JavaScript Capacitor ke halaman (penghubung ke plugin native)
        run: |
          set -e
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          cp node_modules/@capacitor/push-notifications/dist/plugin.js www/cap-push.js
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/cap-fs.js
          head -c 300 www/cap-push.js; echo
          grep -q "registerPlugin" www/cap-push.js
          grep -q "capacitorExports" www/capacitor.js
          sed -i '0,/<head>/s##<head>\n    <script src="capacitor.js"></script>\n    <script src="cap-push.js"></script>\n    <script src="cap-fs.js"></script>#' www/index.html
          head -8 www/index.html
      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon aplikasi
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icons/icon-maskable-192.png $R/mipmap-$d/ic_launcher.png
            cp ../icons/icon-maskable-192.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Firebase (notifikasi push native)
        run: |
          cp google-services.json android/app/google-services.json
          R=android/app/src/main/res
          mkdir -p $R/drawable
          cp ../icons/badge-96.png $R/drawable/ic_stat_rexxa.png
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rexxa" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="manga" />\n    </application>#' $M
          grep -n "firebase\|POST_NOTIFICATIONS" $M || true
      - name: Kunci tanda tangan tetap (agar update bisa dipasang menimpa versi lama)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  rexxa {
                      storeFile file('../../rexxa-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.rexxa }
              }
          }
          GRADLE
      - name: Build APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rexxa-ai.apk
          # pastikan APK memakai kunci tetap (SHA-256 sertifikat harus sama di setiap build)
          keytool -printcert -jarfile ../rexxa-ai.apk | grep -i "SHA256:"
          keytool -printcert -jarfile ../rexxa-ai.apk | grep -qi "BB:6C:E0:3D:7A:72:20:77"
      - uses: actions/upload-artifact@v4
        with: { name: rexxa-ai-apk, path: apk/rexxa-ai.apk }
      - name: Terbitkan ke Release "apk-terbaru"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru rexxa-ai.apk --title "REXXA AI APK (build ${{ github.run_number }})" --notes "Dibangun otomatis dari commit ${{ github.sha }}. Unduh rexxa-ai.apk lalu pasang di HP Android." --latest
